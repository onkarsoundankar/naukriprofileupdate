
name: Naukri Profile Update - Headed Mode

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Configure Gmail OAuth token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          if [ -z "$GMAIL_TOKEN_JSON" ]; then
            echo "GMAIL_TOKEN_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GMAIL_TOKEN_JSON" > gmail-token.json
          chmod 600 gmail-token.json

          echo "Gmail OAuth token file configured."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test Naukri connectivity
        run: |
          echo "Checking Naukri DNS..."
          getent hosts www.naukri.com || true

          echo "Testing HTTP/1.1..."
          curl -v --http1.1 --max-time 15 \
            https://www.naukri.com/ \
            -o /tmp/naukri-http1.html || true

          echo "HTTP/1.1 response size:"
          if [ -f /tmp/naukri-http1.html ]; then
            wc -c /tmp/naukri-http1.html
          fi

          echo "Testing HTTP/2..."
          curl -v --http2 --max-time 15 \
            https://www.naukri.com/ \
            -o /tmp/naukri-http2.html || true

          echo "HTTP/2 response size:"
          if [ -f /tmp/naukri-http2.html ]; then
            wc -c /tmp/naukri-http2.html
          fi

      - name: Run Playwright in headed mode
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: |
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            npx playwright test tests/naukri.spec.js --headed

      - name: Upload debugging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-headed-debug
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
            naukri-homepage.png
            after-login.png
            otp-form.png
            after-otp.png
            headline-updated.png
