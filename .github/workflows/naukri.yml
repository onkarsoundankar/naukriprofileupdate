
name: Naukri Profile Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Naukri connectivity
        continue-on-error: true
        run: |
          echo "Checking HTTPS connectivity..."
          curl -sS -L --max-time 20 \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n" \
            https://www.naukri.com/ || true

      - name: Run Naukri Playwright test
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: xvfb-run --auto-servernum npx playwright test tests/naukri.spec.js --headed

      - name: Upload videos and debugging files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: naukri-playwright-recordings-${{ github.run_number }}
          path: |
            test-results/**/*.webm
            test-results/**/*.png
            test-results/**/*.md
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7