name: Naukri Profile Update

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # 3. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Chromium + Linux dependencies
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # 5. Run Playwright with headed Chromium using Xvfb
      - name: Run Naukri automation
        run: |
          xvfb-run --auto-servernum \
          --server-args="-screen 0 1920x1080x24" \
          npx playwright test tests/naukri.spec.js
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}

      # 6. Upload report, screenshots and traces
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: naukri-debug
          path: |
            playwright-report/
            test-results/
            naukri-homepage.png